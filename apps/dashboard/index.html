<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Monitor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Company Control Center</h1>
      <div class="toolbar">
        <input id="baseUrl" type="text" value="http://localhost:8000" aria-label="API base URL" />
        <button id="healthBtn">Check health</button>
        <input id="apiKey" type="password" placeholder="Gateway API key" aria-label="API key" />
        <button id="healthBtn">Check health</button>
        <button id="planBtn">Generate plan</button>
        <button id="orchBtn">Orchestrate</button>
        <button id="genBtn">Generate product</button>
      </div>
    </header>
    <main>
      <section class="brief-card">
        <h2>Project Brief</h2>
        <textarea id="brief" rows="8">Build a secure fintech web app with AI analytics, a native dashboard, and strong compliance. Must be scalable and deployment-ready.</textarea>
      </section>
      <section class="plan-card">
        <h2>Active Departments</h2>
        <div id="statusBox">Awaiting API call</div>
        <ul id="departments"></ul>
        <h3>Recent Logs</h3>
        <div id="logs"></div>
      </section>
    </main>
    <script>
      const departmentsList = document.getElementById('departments');
      const briefInput = document.getElementById('brief');
      const baseUrlInput = document.getElementById('baseUrl');
      const statusBox = document.getElementById('statusBox');
      const apiKeyInput = document.getElementById('apiKey');
      const logsEl = document.getElementById('logs');

      async function callHealth() {
        const baseUrl = baseUrlInput.value.replace(/\/$/, '');
        statusBox.textContent = 'Checking ' + baseUrl + '/health...';
        try {
          const response = await fetch(baseUrl + '/health');
          const data = await response.json();
          statusBox.textContent = 'Health OK: ' + JSON.stringify(data);
        } catch (err) {
          statusBox.textContent = 'Health check failed: ' + err.message;
        }
      }

      async function fetchLogs() {
        const baseUrl = baseUrlInput.value.replace(/\/$/, '');
        try {
          const r = await fetch(baseUrl + '/logs');
          const j = await r.json();
          logsEl.innerHTML = '';
          for (const e of j.logs.slice(0,20)) {
            const d = document.createElement('div');
            d.innerText = `[${e.ts}] ${e.team}: ${e.message}`;
            logsEl.appendChild(d);
          }
        } catch (err) {
          logsEl.innerText = 'Unable to fetch logs: ' + err.message;
        }
      }

      async function generatePlan() {
        const baseUrl = baseUrlInput.value.replace(/\/$/, '');
        statusBox.textContent = 'Generating plan from ' + baseUrl + '...';
        try {
          const response = await fetch(baseUrl + '/plan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': apiKeyInput.value },
            body: JSON.stringify({
              name: 'Client Platform',
              domain: 'fintech',
              goals: briefInput.value,
              constraints: 'secure, scalable, deployment-ready',
              stack: 'fullstack'
            })
          });
          const data = await response.json();
          departmentsList.innerHTML = '';
          for (const dept of data.departments) {
            const li = document.createElement('li');
            li.innerHTML = `<strong>${dept.title}</strong><small>${dept.scope}</small>`;
            departmentsList.appendChild(li);
          }
          statusBox.textContent = 'Plan generated for ' + data.project + ' (' + data.departments.length + ' departments)';
          // enable orchestrate and generate buttons
          document.getElementById('orchBtn').disabled = false;
          document.getElementById('genBtn').disabled = false;
          // store last plan for orchestrator
          window._lastPlan = data;
          fetchLogs();
        } catch (err) {
          statusBox.textContent = 'Plan generation failed: ' + err.message;
        }
      }

      document.getElementById('healthBtn').addEventListener('click', callHealth);
      document.getElementById('planBtn').addEventListener('click', generatePlan);
      document.getElementById('orchBtn').addEventListener('click', async ()=>{
        const baseUrl = baseUrlInput.value.replace(/\/$/, '');
        if (!window._lastPlan) { statusBox.textContent = 'Generate a plan first'; return }
        statusBox.textContent = 'Starting orchestration...';
        try{
          const body = { name: window._lastPlan.project || 'project', domain: window._lastPlan.summary || 'general', brief: document.getElementById('brief').value }
          const r = await fetch(baseUrl + '/gateway/orchestrate', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': apiKeyInput.value }, body: JSON.stringify(body) });
          const j = await r.json();
          if (j.run_id) {
            statusBox.textContent = 'Orchestration started: ' + j.run_id;
            // poll status
            pollRun(j.run_id);
          } else {
            statusBox.textContent = 'Orchestration failed: ' + JSON.stringify(j);
          }
        }catch(e){ statusBox.textContent = 'Orchestration failed: '+ e.message }
      });

      async function pollRun(runId) {
        const baseUrl = baseUrlInput.value.replace(/\/$/, '');
        try{
          const r = await fetch(baseUrl + '/gateway/runs/' + runId);
          const j = await r.json();
          document.getElementById('statusBox').innerText = 'Run ' + runId + ' status: ' + j.status;
          const logsDiv = document.getElementById('logs');
          logsDiv.innerHTML = '';
          for (const e of j.logs || []) {
            const d = document.createElement('div'); d.innerText = `[${new Date(e.ts*1000).toLocaleTimeString()}] ${e.msg}`; logsDiv.appendChild(d)
          }
          if (j.status && (j.status === 'queued' || j.status === 'running')) {
            setTimeout(()=>pollRun(runId), 1500);
          }
        }catch(e){ console.warn('poll error', e) }
      }

      document.getElementById('genBtn').addEventListener('click', async ()=>{
        const baseUrl = baseUrlInput.value.replace(/\/$/, '');
        statusBox.textContent = 'Generating product...';
        try{
          const r = await fetch(baseUrl + '/gateway/generate', { method: 'POST', headers: { 'Content-Type':'application/json','x-api-key': apiKeyInput.value }, body: JSON.stringify({ name: 'dashboard-triggered' }) });
          const j = await r.json();
          statusBox.textContent = 'Generate result: ' + JSON.stringify(j);
        }catch(e){ statusBox.textContent = 'Generate failed: '+ e.message }
      });
      callHealth();
      generatePlan();
      setInterval(fetchLogs, 5000);
    </script>
  </body>
</html>
